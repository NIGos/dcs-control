; Written by DCS Control for the applied profile; edits here are replaced the next time it is applied.
; DcsQvCull re-reads this file every second while DCS runs. Only the settings that follow the profile are
; written; every other key takes the module's built-in default.
; Ctrl+Alt+F11 in the cockpit: about 3 minutes of A/B, all optimizations OFF (stock DCS) against ON, written to
; report_*.txt and bench_*.csv next to this file. Nothing runs until the key is pressed.
; DcsQvCull.log: a perf line every 10 s (fps, frame times, CPU- or GPU-bound), VRAM every 60 s.

[General]
; Installed for Depth boost alone (Engine Optimizations off): only the perception features run, none of the
; optimizations, the test suite or the engine keys.
PerceptionOnly=0
Diagnostics=1
Beeps=1

[Timing]
ShaderTimeCache=1
TaskQueueClock=1
CacheUs=1000

[Hotkeys]
; Switches the optimizations above off and back on in flight ("virtual-key:modifiers", Ctrl 1, Alt 2, Shift 4; 0:0 off).
Toggle=122:6
; 3D headphone audio off and on in flight (DCS's own panning while off).
AudioToggle=117:6

[Scene]
PartitionBoost=1
CostWeights=1

[D3D]
SplitFilter=1
; Skip idle effect work (0.7): SSAO on water pixels and the heat-haze passes when nothing is hot (same picture).
EarlyShaders=3

[Shadows]
CascadeCache=1

; The governor: when the GPU is the limit, the recorders' extra GPU work is stepped down (and back up when the CPU is
; the limit again); each step is kept only when it raises fps. The image never changes.
[Model]
AllocSlabs=1
PlainTriangleCounter=1
FrameHeapSlabs=1
BigModelPages=1
ShadowInstancing=1
ShadowBatching=1
ShadowPlanAsync=1
ShadowTextureSkip=1
ShadowRecorder=1
; Helper threads per shadow cascade: 1 on CPUs with 8 logical cores or fewer, so DCS keeps its own threads.
ShadowRecorderHelpers=3
GBufferRecorder=1
; Without driver command lists (AMD Radeon, for example): the recorders on the lists the D3D11 runtime emulates.
RecordersEmulatedLists=1
ShaderCompileWorkers=2

[Texture]
StreamDedupe=1

[Effects]
SkipSameConstantBuffer=1

[Water]
; Skip hidden water (0.7, no-submit): a view with no water in sight does not draw DCS's water passes; not exact for
; a few frames when water comes into view.
SkipHiddenWater=3

[Prefetch]
; Terrain prefetch fix: skip (repeats of a range within 5 s are skipped; a prefetch is only a hint), observe
; (only counted) or off. Statistics every 10 s in DcsQvCullPrefetch.log next to this file.
Mode=skip

[Color]
Mode=2
PanelGamut=1
ModeKey=0:0

; Color modes: Fix and Enhanced each have their own values; Night vision and glare are Enhanced only.
[ColorFix]
ExposureEV=0
NightEV=0
Saturation=1
Warmth=0
AdaptBright=0
AdaptDark=0

[ColorEnhanced]
ExposureEV=0
NightEV=0
Saturation=1.15
Warmth=0.35
AdaptBright=0.4
AdaptDark=1.5
NightVision=1
NightVisionStrength=0.8
NightVisionBlue=0.4
NightVisionBlur=0.25
NightVisionScotopic=0.005
NightVisionPhotopic=5
Glare=1
GlareStrength=0.35
GlareThresholdEV=3.5
GlareRadius=5
GlareStreak=0.3

; Gaze DoF (needs the gaze, from the pupil shift layer) and G vision (G from DCS's export, through the module's Lua hook).
[VrFx]
GazeDof=1
GazeDofStrength=0.5
GazeDofMaxArcmin=6
GazeDofSaccadeRelease=1
GazeDofSettleMs=120
GazeDofFadeInMs=250
GazeDofToleranceD=0.3
GazeDofFoveaGuardDeg=2
GazeDofPupilMm=0
GVision=1
GVisionStrength=1
GVisionUseGaze=1
GVisionRedout=1
GVisionTolerance=7.5
GVisionMode=0

[Perception]
; Depth boost's scene depth: DCS's depth buffer sampled around the gaze and published for the pupil shift layer
; (docs/FIXATION_DEPTH.md). On only while the profile uses Depth boost.
FixationDepth=1
; Far depth (docs/FAR_DEPTH.md): the engine's depth for the bundled Quad Views, on with the profile's Far depth.
FarDepthExport=1
; Cockpit mask for Framegen (R65): the cockpit stays still in generated frames. The module computes it only while
; the frame generation layer reads it (its heartbeat), so it costs nothing otherwise.
CockpitMaskExport=1
; Cockpit depth and DCS's motion vectors for Framegen (R69/R70): computed only while the frame generation layer reads
; them (its heartbeats), so they cost nothing otherwise.
CockpitDepthExport=1
CockpitMotionExport=1
CockpitMotionFocus=1
CockpitMotionDepth=1
; The HUD and helmet symbols as their own layer for frame generation (R95); with or without the dual camera.
SymbologyExport=1
; Depth boost's dual camera: the cockpit, its lighting and its displays at the true eye distance while the world
; is rendered boosted; the HUD stays at DCS's camera.
CockpitTrueIpd=1
CockpitTrueIpdOwnship=2

; Periphery DLSS preset (applies at the next mission load): a lighter preset outside the Quad Views focus, the focus
; keeps its own. The pupil shift layer hides the driver profile's forced preset from DLSS (read-only).
[DLSS]
PeripheryPreset=K
FocusPreset=K
IgnoreDriverPreset=1

[Log]
ReloadFrameTimes=1

; 3D headphone audio (docs/BINAURAL_AUDIO.md): DCS's left/right panning of mono 3D sounds replaced by HRTF
; rendering. Every key applies in flight. toggle_audio.flag next to DcsQvCull.dll switches it off and on.
; CockpitSpace (docs/COCKPIT_SPACE.md): 0 off, 1 subtle, 2 normal, 3 strong.
[Audio]
Binaural=1
Hrtf=default
HeadCircumferenceCm=57
LateHeadTracking=1
NearField=1
MaxObjects=48
LevelTrimDb=0
CpuBudgetPercent=25
LogVoices=1
CockpitSpace=1
CockpitSpaceFamily=auto
CockpitSpaceCanopy=1

[Dev]
; Developer mode: a payload built elsewhere, hot-reloaded, and an ini that replaces this one. Empty: off.
PayloadPath=
IniPath=
