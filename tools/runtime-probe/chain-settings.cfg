# Quad Views settings for the chain probe (CHAIN.md). Not a DCS Control profile: a neutral file so that the command
# lines in CHAIN.md run as written. To measure with the real sizes and fovea, pass the profile file DCS Control writes
# (quadviews\settings.cfg in its profile folder) to scripts\run-chain-probe.ps1 instead: its [exe:DCS] sections are
# renamed for the probe.
#
# The layer reads settings.cfg beside its DLL first, then this file; keys here win. run-chain-probe.ps1 appends
# turbo_mode=0, force_no_eye_tracking=1, dcsvr_far_depth=0 and dcsvr_two_layers=0|1 after these.
[exe:probe_run]
stereo_output_multiplier=1
# The analysis models the fade as common.h does: rounded, exponent 8, smoothing 0.2.
smoothen_focus_view_edges=0.2
focus_view_shape=8
# Anything that changes pixels on its own is off, so the cases measure the composition and nothing else.
sharpen_focus_view=0
dcsvr_periphery_sharpen=0
dcsvr_sharpen_taper=0
dcsvr_temporal=0
